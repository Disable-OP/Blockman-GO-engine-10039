# Blockman-GO-engine-10039 — Android build workflow
#
# IMPORTANT: This workflow runs ONLY on manual dispatch (workflow_dispatch).
# It does NOT trigger on push, PR, schedule, or any other event. This is
# intentional — the user has limited GitHub Actions storage quota (0.5 GB)
# and cannot afford a build per push.
#
# To run: GitHub → Actions tab → "Android Build (Manual)" → Run workflow.
#
# Caching strategy (to keep rebuilds fast AND keep storage clean):
#   1. NDK r17c cache — stable key "ndk-r17c-v1". The NDK is ~1.2 GB
#      unzipped; caching it saves ~1 min download+unzip per run. The key
#      never changes (NDK r17c is frozen), so there's exactly ONE cache
#      entry — no clutter.
#   2. ccache — stable key "ccache-{abi}-{hash-of-cpp-sources}". ccache
#      stores precompiled object files keyed by a hash of the source +
#      compiler flags. On a no-change rebuild, hit rate is ~100% and the
#      full C++ compile (steps 1-5, ~30 min) drops to ~3 min. The key
#      rolls only when source files change, so old entries are evicted
#      automatically by GitHub's LRU policy.
#   3. Gradle cache — keyed by hash of build.gradle files.
#   4. Artifact names are STABLE (no run_id suffix) so re-runs OVERWRITE
#      the same artifact instead of piling up new ones. This keeps the
#      artifact list short: 1 APK + 1 .so + 1 logs bundle = 3 entries
#      total, regardless of how many runs you do.

name: Android Build (Manual)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (Debug or Release)'
        required: true
        default: 'Debug'
        type: choice
        options:
          - Debug
          - Release
      abi:
        description: 'Target ABI (only armeabi-v7a is supported today; legacy gnustl_static)'
        required: true
        default: 'armeabi-v7a'
        type: choice
        options:
          - armeabi-v7a
      skip_deps:
        description: 'Skip the third-party deps build step (use cached/prebuilt libs)'
        required: false
        default: false
        type: boolean
      clean_cache:
        description: 'Bypass all caches (force full rebuild from scratch)'
        required: false
        default: false
        type: boolean

# Cancel any previous manual run when a new one is started.
concurrency:
  group: android-build-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    env:
      NDK_VERSION: r17c
      ABI: ${{ github.event.inputs.abi || 'armeabi-v7a' }}
      BUILD_TYPE: ${{ github.event.inputs.build_type || 'Debug' }}
      # ccache config: 500 MB cap (enough for the whole project), use
      # compiler_hash for uniqueness, compress storage.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 6
      NDK_CCACHE: /usr/bin/ccache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17 (for Android SDK setup)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-26 build-tools;26.0.2'

      # ----------------------------------------------------------------
      # Cache 1: NDK r17c — stable key, never rolls. Saves ~1 min/run.
      # Uses a separate save step (at the end of the job, with if: always())
      # because the default post-cache save is SKIPPED when the job fails.
      # ----------------------------------------------------------------
      - name: Restore Android NDK r17c
        id: ndk-cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/android-ndk-r17c
          key: ndk-r17c-v1

      - name: Set up Android NDK r17c
        # NDK r17c is the last version with gnustl_static, which the project uses.
        # Modern NDK (r22+) removed gnustl — the project won't link against it.
        if: steps.ndk-cache.outputs.cache-hit != 'true'
        run: |
          cd $HOME
          wget -q https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
          unzip -q android-ndk-r17c-linux-x86_64.zip
          rm android-ndk-r17c-linux-x86_64.zip

      - name: Export NDK env vars
        run: |
          echo "ANDROID_NDK_HOME=$HOME/android-ndk-r17c" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$HOME/android-ndk-r17c" >> $GITHUB_ENV
          echo "NDK_ROOT=$HOME/android-ndk-r17c" >> $GITHUB_ENV

      # ----------------------------------------------------------------
      # Cache 2: ccache — STABLE key (never rolls on source change).
      # This is intentional: ccache is content-addressed internally, so
      # when a source file changes, ONLY that file gets recompiled —
      # everything else stays cached. A rolling key would throw away the
      # whole cache on every source change, defeating the purpose.
      # Key rolls only when we bump the "-v1" suffix manually (e.g. to
      # force a clean cache after a compiler upgrade).
      #
      # Uses actions/cache/restore (restore-only) + a separate save step
      # at the end with if: always(). The default actions/cache post-step
      # is SKIPPED when the job fails, which means all compilation work
      # done before the failure is lost. The separate save step fixes this.
      # ----------------------------------------------------------------
      - name: Restore ccache
        id: ccache-cache
        if: ${{ github.event.inputs.clean_cache != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.ABI }}-v2
          # restore-keys uses a broad prefix so we can still restore
          # from the OLD v1 cache (500MB, missing logic+server) while
          # the new v2 cache (2G, complete) is being populated.
          restore-keys: |
            ccache-${{ env.ABI }}-v2
            ccache-${{ env.ABI }}-v1
            ccache-${{ env.ABI }}-

      - name: Install ccache + host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache cmake ninja-build python3 \
            zlib1g-dev libssl-dev \
            unzip wget
          # Print ccache stats (will be empty on first run, populated on later runs).
          ccache --version || true
          ccache -s || true
          # Create the ccache dir if the cache miss left it absent.
          mkdir -p $CCACHE_DIR

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('engine-main/client/Shells/Android/Blockmango/**/build.gradle', 'engine-main/client/Shells/Android/Blockmango/**/settings.gradle') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Fix libtinfo.so.5 for NDK r17c clang
        # NDK r17c's clang binary is linked against libtinfo.so.5, which
        # Ubuntu 22.04 no longer ships (it has libtinfo.so.6). The clang
        # binary only uses a handful of symbols that are ABI-compatible
        # across the libtinfo 5/6 boundary, so a symlink works.
        run: |
          LIBTINFO6=$(find /usr/lib /lib -name 'libtinfo.so.6*' 2>/dev/null | head -1)
          if [ -z "$LIBTINFO6" ]; then
            echo "ERROR: libtinfo.so.6 not found on the runner — cannot create libtinfo.so.5 symlink."
            exit 1
          fi
          LIBTINFO5_LINK="${LIBTINFO6%/*}/libtinfo.so.5"
          echo "Symlinking $LIBTINFO5_LINK -> $LIBTINFO6"
          sudo ln -sf "$LIBTINFO6" "$LIBTINFO5_LINK"
          sudo ldconfig
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version || {
            echo "clang still fails to load after libtinfo symlink:"
            ldd $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/clang | grep -i "not found" || true
            exit 1
          }

      - name: Print environment + ccache stats
        run: |
          echo "=== Environment ==="
          echo "NDK_ROOT=$NDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ABI=$ABI"
          echo "BUILD_TYPE=$BUILD_TYPE"
          echo "CCACHE_DIR=$CCACHE_DIR"
          echo "NDK_CCACHE=$NDK_CCACHE"
          echo "=== ndk-build version ==="
          $NDK_ROOT/ndk-build --version || true
          echo "=== clang version (NDK) ==="
          $NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang --version
          echo "=== ccache version ==="
          ccache --version
          echo "=== ccache stats (before build) ==="
          ccache -s

      # ----------------------------------------------------------------
      # Step 1: Build third-party deps (FreeImage, FreeType, LuaJIT, zlib).
      # ndk-build uses NDK_CCACHE env var (set above) automatically.
        # NOTE: We no longer pass -B (force-rebuild) — that was defeating
        # the ccache + incremental build. ndk-build's own make dependency
        # tracking handles incremental builds correctly.
      # ----------------------------------------------------------------
      - name: Build third-party deps (ndk-build)
        if: ${{ github.event.inputs.skip_deps != true && github.event.inputs.skip_deps != 'true' }}
        working-directory: engine-main/engine/NDKBuild/DepBuild
        run: |
          set -o pipefail
          echo "Building third-party deps for $ABI..."
          $NDK_ROOT/ndk-build NDK_DEBUG=0 APP_ABI=$ABI APP_PLATFORM=android-14 APP_STL=gnustl_static 2>&1 | tee deps-build.log
          echo "=== Deps build artifacts ==="
          find . -name "*.a" | head -20

      # ----------------------------------------------------------------
      # Step 2: Build the engine core (LordCore + LordGLES2Render).
      # ----------------------------------------------------------------
      - name: Build engine core (ndk-build)
        working-directory: engine-main/engine/NDKBuild
        run: |
          set -o pipefail
          echo "Building engine core for $ABI..."
          $NDK_ROOT/ndk-build NDK_DEBUG=0 APP_ABI=$ABI APP_PLATFORM=android-14 APP_STL=gnustl_static 2>&1 | tee engine-build.log
          find . -name "*.a" | head -20

      # ----------------------------------------------------------------
      # Step 3: Build the shared libraries (RakNet, cpr, curl, g3log).
      # ----------------------------------------------------------------
      - name: Build shared libraries (ndk-build)
        working-directory: engine-main/libraries/ApkBuild
        run: |
          set -o pipefail
          echo "Building shared libraries for $ABI..."
          $NDK_ROOT/ndk-build NDK_DEBUG=0 APP_ABI=$ABI APP_PLATFORM=android-14 APP_STL=gnustl_static 2>&1 | tee libs-build.log
          find . -name "*.a" | head -20

      # ----------------------------------------------------------------
      # Step 3.5: Build the logic static lib (libLogic.a).
      # The server links against libLogic.a — it must be built before
      # the server CMake step. Outputs to logic/Bin/$(APP_OPTIM)/$(ABI)/.
      # ----------------------------------------------------------------
      - name: Build logic static lib (ndk-build)
        working-directory: engine-main/logic/ApkBuild
        run: |
          set -o pipefail
          echo "Building logic static lib for $ABI..."
          $NDK_ROOT/ndk-build NDK_DEBUG=0 APP_ABI=$ABI APP_PLATFORM=android-14 APP_STL=gnustl_static 2>&1 | tee logic-build.log
          find . -name "*.a" | head -20

      # ----------------------------------------------------------------
      # Step 4: Build the client static lib (libGameClient.a).
      # ----------------------------------------------------------------
      - name: Build client static lib (ndk-build)
        working-directory: engine-main/client/ApkBuild
        run: |
          set -o pipefail
          echo "Building client static lib for $ABI..."
          $NDK_ROOT/ndk-build NDK_DEBUG=0 APP_ABI=$ABI APP_PLATFORM=android-14 APP_STL=gnustl_static 2>&1 | tee client-build.log

      # ----------------------------------------------------------------
      # Step 5: Build the server shared library (libGameServer.so) via
      # CMake. CMAKE_C/CXX_COMPILER_LAUNCHER=ccache makes CMake route
      # every compile through ccache.
      # ----------------------------------------------------------------
      - name: Build server shared lib (libGameServer.so) via CMake
        working-directory: engine-main/server
        run: |
          set -o pipefail
          mkdir -p build-android-$ABI
          cd build-android-$ABI
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_ROOT/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=$ABI \
            -DANDROID_PLATFORM=android-14 \
            -DANDROID_STL=gnustl_static \
            -DLORD_BUILD_PLATFORM_ANDROID=ON \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build . -j$(nproc) 2>&1 | tee server-build.log
          echo "=== Server build artifacts ==="
          find . -name "*.so" -o -name "*.a" | head -20

      - name: Print ccache stats (after build)
        if: always()
        run: |
          echo "=== ccache stats (after build) ==="
          ccache -s

      # ----------------------------------------------------------------
      # Step 6: Copy libGameServer.so + libBlockMan.so into the Gradle
      # jniLibs directory so the APK packages them.
      # ----------------------------------------------------------------
      - name: Stage native libs into Gradle jniLibs
        working-directory: engine-main/client/Shells/Android/Blockmango/app
        run: |
          mkdir -p libs/$ABI
          cp -v ../../../../client/Bin/$ABI/libBlockMan.so libs/$ABI/ 2>/dev/null || \
            echo "WARNING: libBlockMan.so not found at expected path; the APK build may fail."
          cp -v ../../../../server/build-android-$ABI/libGameServer.so libs/$ABI/ 2>/dev/null || \
            echo "WARNING: libGameServer.so not found at expected path; the APK build may fail."
          cp -v $NDK_ROOT/sources/cxx-stl/gnu-libstdc++/4.9/libs/$ABI/libgnustl_shared.so libs/$ABI/ 2>/dev/null || \
            echo "WARNING: libgnustl_shared.so not found at NDK path."
          ls -la libs/$ABI/

      - name: Stage game assets into APK assets directory
        # Copy engine-res-main/ (Media/, recipe/, resource.cfg) into the
        # APK's assets/resources/ directory. The Java side (EchoesActivity)
        # copies assets/resources/ to the app's private files dir at first
        # launch, then passes that path as rootPath to C++. The C++ engine
        # loads rootPath/resource.cfg which mounts Media/ and recipe/.
        working-directory: engine-main/client/Shells/Android/Blockmango/app
        run: |
          mkdir -p src/main/assets/resources
          # Copy all game assets (Media/, recipe/, resource.cfg) from
          # engine-res-main/ (at repo root) into assets/resources/.
          # Path: app/ → Blockmango/ → Android/ → Shells/ → client/ → engine-main/ → repo root
          cp -r ../../../../../engine-res-main/* src/main/assets/resources/
          echo "=== Assets staged ==="
          find src/main/assets/resources -maxdepth 2 -type d | head -20
          echo "=== Total asset files ==="
          find src/main/assets/resources -type f | wc -l

      # ----------------------------------------------------------------
      # Step 7: Build the APK via Gradle.
      # The Gradle wrapper (gradlew) uses Java's HttpsURLConnection to
      # download Gradle 4.1 — but Java 17 gets "Connection refused" on
      # the old services.gradle.org TLS. We bypass the wrapper entirely:
      # download + extract the Gradle distribution with wget, then call
      # the extracted `gradle` binary directly.
      #
      # IMPORTANT: Gradle 4.1 + AGP 2.3.3 require JDK 8. We install JDK 8
      # here (after the C++ build which doesn't need Java) and switch
      # JAVA_HOME so the Gradle step uses JDK 8, not JDK 17.
      # ----------------------------------------------------------------
      - name: Set up JDK 8 (for Gradle 4.1 + AGP 2.3.3)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      - name: Cache Gradle 4.10.2 distribution
        id: gradle-dist-cache
        uses: actions/cache@v4
        with:
          path: /home/runner/gradle-4.10.2
          key: gradle-4.10.2-extracted-v1

      - name: Download + extract Gradle 4.10.2
        if: steps.gradle-dist-cache.outputs.cache-hit != 'true'
        run: |
          cd /home/runner
          wget -q https://services.gradle.org/distributions/gradle-4.10.2-bin.zip
          unzip -q gradle-4.10.2-bin.zip
          rm gradle-4.10.2-bin.zip
          # Verify the gradle binary works
          /home/runner/gradle-4.10.2/bin/gradle --version

      - name: Build APK (Gradle)
        working-directory: engine-main/client/Shells/Android/Blockmango
        env:
          # Force TLS 1.2 — Java 8's default TLS config can't connect to
          # modern HTTPS servers (google(), mavenCentral(), jcenter).
          GRADLE_OPTS: "-Dhttps.protocols=TLSv1.2"
        run: |
          set -o pipefail
          # Use the extracted Gradle directly (bypasses the broken wrapper).
          export PATH=/home/runner/gradle-4.10.2/bin:$PATH
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee apk-build.log
          echo "=== APK artifacts ==="
          find . -name "*.apk" -type f

      # ----------------------------------------------------------------
      # Step 8: Upload artifacts. Names are STABLE (no run_id suffix) so
      # re-runs overwrite the same artifact instead of piling up new
      # ones. This keeps storage usage flat regardless of run count.
      # ----------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blockman-go-apk
          path: |
            engine-main/client/Shells/Android/Blockmango/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Upload libGameServer.so
        uses: actions/upload-artifact@v4
        with:
          name: libGameServer
          path: |
            engine-main/server/build-android-${{ env.ABI }}/libGameServer.so
          if-no-files-found: warn
          retention-days: 30
          overwrite: true

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            engine-main/engine/NDKBuild/DepBuild/deps-build.log
            engine-main/engine/NDKBuild/engine-build.log
            engine-main/libraries/ApkBuild/libs-build.log
            engine-main/logic/ApkBuild/logic-build.log
            engine-main/client/ApkBuild/client-build.log
            engine-main/server/build-android-${{ env.ABI }}/server-build.log
            engine-main/client/Shells/Android/Blockmango/apk-build.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

      # ----------------------------------------------------------------
      # Step 10: SAVE caches. These run with `if: always()` so they
      # execute even when the job fails (e.g. server compile error).
      # This is the fix for the "Post Restore ccache SKIPPED" bug —
      # the default actions/cache post-step is skipped on failure, but
      # a separate actions/cache/save step with if: always() always runs.
      # Without this, all compilation done before the failure is lost.
      # ----------------------------------------------------------------
      - name: Save ccache
        if: always() && github.event.inputs.clean_cache != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ env.ABI }}-v2

      - name: Save Android NDK r17c
        if: always() && steps.ndk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/android-ndk-r17c
          key: ndk-r17c-v1

      - name: Save Gradle 4.10.2 distribution
        if: always() && steps.gradle-dist-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/gradle-4.10.2
          key: gradle-4.10.2-extracted-v1

      # ----------------------------------------------------------------
      # Step 9: Print the storage usage so the user can track quota.
      # ----------------------------------------------------------------
      - name: Print artifact storage summary
        if: always()
        run: |
          echo "=== Build complete ==="
          echo "ABI: $ABI"
          echo "Build type: $BUILD_TYPE"
          echo "Run ID: ${{ github.run_id }}"
          echo "ccache key: ccache-$ABI-v1 (stable — never rolls on source change)"
          echo ""
          echo "Cache entries (stable, auto-evicted by GitHub LRU):"
          echo "  - ndk-r17c-v1          (NDK r17c, ~1.2 GB, never rolls)"
          echo "  - ccache-$ABI-v1       (~500 MB, stable — content-addressed internally)"
          echo "  - gradle-<os>-<hash>   (~200 MB, rolls on gradle change)"
          echo ""
          echo "Artifact entries (STABLE names — re-runs overwrite, no clutter):"
          echo "  - blockman-go-apk      (the APK)"
          echo "  - libGameServer         (the .so)"
          echo "  - build-logs            (6 .log files)"
          echo ""
          echo "Total: 3 cache entries + 3 artifact entries = 6 items, flat."
